<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleries - Linh Trang AI Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .galleries-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .galleries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .galleries-header h1 {
            font-size: 2rem;
            color: #c9d1d9;
            margin: 0;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #1c2128;
            border-color: #58a6ff;
            color: #58a6ff;
        }

        .galleries-stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #8b949e;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #58a6ff;
        }

        /* Justified Grid Layout - Google Photos Style */
        .justified-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 0 -4px;
        }

        .gallery-row {
            display: flex;
            gap: 4px;
            width: 100%;
            margin-bottom: 4px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-grow: 1;
            height: 250px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .gallery-item:hover::before {
            opacity: 1;
        }

        .gallery-item-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            z-index: 2;
        }

        .gallery-item:hover .gallery-item-title {
            opacity: 1;
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #8b949e;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #8b949e;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lightbox-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 1rem 2rem;
            border-radius: 8px;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="galleries-container">
        <!-- Header -->
        <div class="galleries-header">
            <h1><i class="fas fa-images"></i> Galleries / Thư Viện Ảnh</h1>
            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Back to Manager / Quay Lại
            </a>
        </div>

        <!-- Stats -->
        <div class="galleries-stats">
            <div class="stat-item">
                <span class="stat-label">Total Images / Tổng Số Ảnh</span>
                <span class="stat-value" id="totalImages">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Scenes with Images / Cảnh Có Ảnh</span>
                <span class="stat-value" id="totalScenes">0</span>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <i class="fas fa-spinner fa-spin"></i> Loading images...
        </div>

        <!-- Gallery Grid -->
        <div id="galleryGrid" class="justified-gallery" style="display: none;">
            <!-- Images will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-image"></i>
            <p>No images uploaded yet / Chưa có ảnh nào được tải lên</p>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            <div class="lightbox-info">
                <div id="lightboxTitle"></div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="galleries.js"></script>
</body>

</html>
